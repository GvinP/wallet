name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & component tests (with coverage)
        run: npm run test:coverage -- --ci

      - name: Expo doctor
        run: npx expo-doctor
