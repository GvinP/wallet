name: Release APK

# Public build: push a tag that matches app.json's version, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# → release APK (no developer helpers) signed with YOUR release key → GitHub Releases.
#
# Required secrets (Settings → Secrets and variables → Actions) — see docs/RELEASE.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional: EXPO_PUBLIC_ETHERSCAN_KEY / EXPO_PUBLIC_COINGECKO_KEY (secrets),
#           EXPO_PUBLIC_USDT_AMOY (variable). These are inlined into the APK (public API keys).

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_ETHERSCAN_KEY: ${{ secrets.EXPO_PUBLIC_ETHERSCAN_KEY }}
      EXPO_PUBLIC_COINGECKO_KEY: ${{ secrets.EXPO_PUBLIC_COINGECKO_KEY }}
      EXPO_PUBLIC_USDT_AMOY: ${{ vars.EXPO_PUBLIC_USDT_AMOY }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match app.json version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Release signing secrets must be set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KS_PASS ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Missing release signing secret ($v) — see docs/RELEASE.md"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Build (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Re-sign with the release key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KS" | base64 -d > "$KEYSTORE"
          mkdir -p dist
          OUT="dist/amethyst-${VERSION}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass env:KS_PASS \
            --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS \
            --out "$OUT" android/app/build/outputs/apk/release/app-release.apk
          rm -f "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          name: Amethyst ${{ env.VERSION }} (Polygon Amoy testnet)
          files: |
            dist/amethyst-${{ env.VERSION }}.apk
            dist/amethyst-${{ env.VERSION }}.apk.sha256
          generate_release_notes: true
          body: |
            Self-custody wallet for Polygon — **testnet (Amoy) build**: tokens here have no real value.

            **Install (Android 8+, arm64):** download `amethyst-${{ env.VERSION }}.apk`, open it on the phone and allow
            "Install unknown apps" for your browser / file manager. Checksum: `.sha256` file.
